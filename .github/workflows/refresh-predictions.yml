name: Refresh shared prediction history
on:
  push:
    paths:
      - .github/workflows/refresh-predictions.yml
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nhl-prediction-history
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Save pregame predictions and verify finished games
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 60 \
            'https://hockey-rating-matrix.sty447.chatgpt.site/api/predictions' \
            --output history.json
          python - <<'PY'
          import json
          with open('history.json') as f:
              data = json.load(f)
          assert isinstance(data.get('forecasts'), list), data
          assert isinstance(data.get('results'), list), data
          checked = [r for r in data['results'] if isinstance(r.get('homeProbability'), (int, float))]
          correct = sum(bool(r.get('correct')) for r in checked)
          print(f"Shared history refreshed: {len(data['forecasts'])} forecasts, {len(data['results'])} results, {correct}/{len(checked)} correct.")
          PY
